<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>지뢰찾기 | Play & Study</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:"Malgun Gothic",sans-serif;

    background:linear-gradient(#dff5ff,#f7fcff);

    color:#444;

}

.container{

    width:900px;

    margin:40px auto;

}

.card{

    background:white;

    border-radius:25px;

    padding:30px;

    box-shadow:0 10px 25px rgba(0,0,0,.12);

}

h1{

    text-align:center;

    color:#ff9800;

    margin-bottom:15px;

}

.info{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:20px;

}

button{

    border:none;

    border-radius:12px;

    padding:10px 20px;

    background:#ffb300;

    color:white;

    font-size:16px;

    cursor:pointer;

}

button:hover{

    background:#ff9800;

}

#board{

    display:grid;

    grid-template-columns:repeat(9,50px);

    grid-template-rows:repeat(9,50px);

    gap:3px;

    justify-content:center;

}

.cell{

    width:50px;

    height:50px;

    background:#b9e8ff;

    border-radius:8px;

    display:flex;

    justify-content:center;

    align-items:center;

    font-weight:bold;

    font-size:20px;

    cursor:pointer;

    user-select:none;

    transition:.15s;

}

.cell:hover{

    background:#9bdcff;

}

.cell.open{

    background:white;

}

.cell.mine{

    background:#ff8f8f;

}

.cell.flag{

    background:#ffe082;

}

.message{

    margin-top:20px;

    text-align:center;

    font-size:22px;

    font-weight:bold;

}

.n1{color:#2196f3;}
.n2{color:#4caf50;}
.n3{color:#f44336;}
.n4{color:#673ab7;}
.n5{color:#795548;}
.n6{color:#009688;}
.n7{color:#000;}
.n8{color:#555;}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>💣 지뢰찾기</h1>

<div class="info">

<div>
좌클릭 : 칸 열기<br>
우클릭 : 🚩 깃발
</div>

<button id="restart">
다시 시작
</button>

</div>

<div id="board"></div>

<div class="message" id="message"></div>

</div>

</div>

<script>

const SIZE=9;

const MINES=10;

let board=[];

let firstClick=true;

let gameOver=false;

const boardElement=document.getElementById("board");

const message=document.getElementById("message");

function createBoard(){

board=[];

boardElement.innerHTML="";

message.textContent="";

gameOver=false;

firstClick=true;

for(let y=0;y<SIZE;y++){

let row=[];

for(let x=0;x<SIZE;x++){

row.push({

mine:false,

open:false,

flag:false,

count:0

});

const cell=document.createElement("div");

cell.className="cell";

cell.dataset.x=x;

cell.dataset.y=y;

cell.oncontextmenu=(e)=>{

e.preventDefault();

toggleFlag(x,y);

};

cell.onclick=()=>{

clickCell(x,y);

};

boardElement.appendChild(cell);

}

board.push(row);

}

}

createBoard();

document
.getElementById("restart")
.onclick=createBoard;

function placeMines(safeX,safeY){

let placed=0;

while(placed<MINES){

const x=Math.floor(Math.random()*SIZE);

const y=Math.floor(Math.random()*SIZE);

if(board[y][x].mine) continue;

if(x===safeX&&y===safeY) continue;

board[y][x].mine=true;

placed++;

}

calculateNumbers();

}

function calculateNumbers(){

for(let y=0;y<SIZE;y++){

for(let x=0;x<SIZE;x++){

if(board[y][x].mine) continue;

let count=0;

for(let yy=-1;yy<=1;yy++){

for(let xx=-1;xx<=1;xx++){

const nx=x+xx;

const ny=y+yy;

if(nx<0||ny<0||nx>=SIZE||ny>=SIZE)
continue;

if(board[ny][nx].mine)
count++;

}

}

board[y][x].count=count;

}

}

}
function clickCell(x,y){

    if(gameOver) return;

    const cell=board[y][x];

    if(cell.open||cell.flag) return;

    if(firstClick){

        placeMines(x,y);

        firstClick=false;

    }

    if(cell.mine){

        revealMines();

        gameOver=true;

        message.textContent="💥 GAME OVER";

        return;

    }

    openCell(x,y);

    checkWin();

}

function openCell(x,y){

    const queue=[[x,y]];

    while(queue.length){

        const [cx,cy]=queue.shift();

        const cell=board[cy][cx];

        if(cell.open||cell.flag) continue;

        cell.open=true;

        const div=getCell(cx,cy);

        div.classList.add("open");

        if(cell.count>0){

            div.textContent=cell.count;

            div.classList.add("n"+cell.count);

            continue;

        }

        for(let yy=-1;yy<=1;yy++){

            for(let xx=-1;xx<=1;xx++){

                const nx=cx+xx;

                const ny=cy+yy;

                if(nx<0||ny<0||nx>=SIZE||ny>=SIZE)
                    continue;

                if(!board[ny][nx].open){

                    queue.push([nx,ny]);

                }

            }

        }

    }

}

function toggleFlag(x,y){

    if(gameOver) return;

    const cell=board[y][x];

    if(cell.open) return;

    cell.flag=!cell.flag;

    const div=getCell(x,y);

    if(cell.flag){

        div.classList.add("flag");

        div.textContent="🚩";

    }else{

        div.classList.remove("flag");

        div.textContent="";

    }

}

function getCell(x,y){

    return boardElement.children[y*SIZE+x];

}
function revealMines(){

    for(let y=0;y<SIZE;y++){

        for(let x=0;x<SIZE;x++){

            if(board[y][x].mine){

                const div=getCell(x,y);

                div.classList.add("mine");

                div.textContent="💣";

            }

        }

    }

}

function checkWin(){

    let opened=0;

    for(let y=0;y<SIZE;y++){

        for(let x=0;x<SIZE;x++){

            if(board[y][x].open){

                opened++;

            }

        }

    }

    if(opened===SIZE*SIZE-MINES){

        gameOver=true;

        message.textContent="🎉 축하합니다! 클리어!";

        revealFlags();

    }

}

function revealFlags(){

    for(let y=0;y<SIZE;y++){

        for(let x=0;x<SIZE;x++){

            if(board[y][x].mine){

                const div=getCell(x,y);

                div.textContent="🚩";

                div.classList.add("flag");

            }

        }

    }

}

createBoard();

</script>

</body>
</html>
