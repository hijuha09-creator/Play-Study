<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<title>갤러그 | Play & Study</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:"Malgun Gothic",sans-serif;

background:linear-gradient(#00153b,#000814);

overflow:hidden;

color:white;

}

#game{

display:block;

margin:20px auto;

background:#020b24;

border:4px solid #5ec8ff;

border-radius:18px;

box-shadow:0 0 25px rgba(0,180,255,.35);

}

#menu{

position:absolute;

left:50%;

top:50%;

transform:translate(-50%,-50%);

width:340px;

padding:30px;

background:rgba(0,0,0,.82);

border-radius:20px;

text-align:center;

}

#menu h1{

color:#ffd54f;

margin-bottom:20px;

}

#menu button{

width:100%;

margin:10px 0;

padding:14px;

font-size:20px;

border:none;

border-radius:12px;

cursor:pointer;

background:#29b6f6;

color:white;

}

#menu button:hover{

background:#03a9f4;

}

#score{

position:absolute;

left:20px;

top:20px;

font-size:24px;

font-weight:bold;

}

#message{

position:absolute;

left:50%;

top:50%;

transform:translate(-50%,-50%);

font-size:60px;

font-weight:bold;

display:none;

color:#fff176;

text-shadow:0 0 20px gold;

}

#restart{

display:none;

position:absolute;

left:50%;

bottom:40px;

transform:translateX(-50%);

padding:14px 30px;

font-size:20px;

border:none;

border-radius:12px;

background:#ff9800;

color:white;

cursor:pointer;

}

</style>

</head>

<body>

<div id="score">

점수 : 0

</div>

<div id="message"></div>

<div id="menu">

<h1>🚀 GALAGA</h1>

<button data-level="easy">

🟢 쉬움

</button>

<button data-level="normal">

🟡 보통

</button>

<button data-level="hard">

🔴 어려움

</button>

</div>

<button id="restart">

다시 시작

</button>

<canvas

id="game"

width="800"

height="700">

</canvas>

<script>

const canvas=document.getElementById("game");

const ctx=canvas.getContext("2d");

const scoreText=document.getElementById("score");

const message=document.getElementById("message");

const restart=document.getElementById("restart");

const menu=document.getElementById("menu");

const WIDTH=canvas.width;

const HEIGHT=canvas.height;

const game={

running:false,

score:0,

level:"easy",

enemySpeed:1,

attackCount:1,

player:null,

bullets:[],

enemies:[],

attackers:[],

keys:{},

stars:[]

};

function initStars(){

game.stars=[];

for(let i=0;i<120;i++){

game.stars.push({

x:Math.random()*WIDTH,

y:Math.random()*HEIGHT,

r:Math.random()*2+1,

speed:Math.random()*0.8+0.2

});

}

}

function createPlayer(){

game.player={

x:WIDTH/2-20,

y:HEIGHT-70,

w:40,

h:40,

speed:6

};

}

function createEnemies(){

game.enemies=[];

for(let r=0;r<5;r++){

for(let c=0;c<8;c++){

game.enemies.push({

homeX:140+c*60,

homeY:80+r*55,

x:140+c*60,

y:80+r*55,

w:34,

h:34,

alive:true,

attacking:false,

vx:0,

vy:0

});

}

}

}
function applyDifficulty(level){

    game.level=level;

    switch(level){

        case "easy":
            game.enemySpeed=1.0;
            game.attackCount=1;
            game.player.speed=7;
            break;

        case "normal":
            game.enemySpeed=1.6;
            game.attackCount=2;
            game.player.speed=6;
            break;

        case "hard":
            game.enemySpeed=2.2;
            game.attackCount=3;
            game.player.speed=5;
            break;

    }

}

function startGame(level){

    game.score=0;

    scoreText.textContent="점수 : 0";

    message.style.display="none";

    restart.style.display="none";

    menu.style.display="none";

    game.running=true;

    createPlayer();

    createEnemies();

    applyDifficulty(level);

}

document.querySelectorAll("#menu button").forEach(btn=>{

    btn.onclick=()=>{

        startGame(btn.dataset.level);

    };

});

document.addEventListener("keydown",e=>{

    game.keys[e.code]=true;

});

document.addEventListener("keyup",e=>{

    game.keys[e.code]=false;

});

function movePlayer(){

    if(!game.running) return;

    if(game.keys["ArrowLeft"]){

        game.player.x-=game.player.speed;

    }

    if(game.keys["ArrowRight"]){

        game.player.x+=game.player.speed;

    }

    if(game.player.x<0){

        game.player.x=0;

    }

    if(game.player.x>WIDTH-game.player.w){

        game.player.x=WIDTH-game.player.w;

    }

}

let formationOffset=0;

let formationDirection=1;

function moveFormation(){

    formationOffset+=formationDirection*game.enemySpeed;

    if(formationOffset>80||formationOffset<-80){

        formationDirection*=-1;

    }

    game.enemies.forEach(enemy=>{

        if(!enemy.alive) return;

        if(enemy.attacking) return;

        enemy.x=enemy.homeX+formationOffset;

        enemy.y=enemy.homeY;

    });

}

function drawPlayer(){

    if(!game.player) return;

    ctx.fillStyle="#4fc3f7";

    ctx.beginPath();

    ctx.moveTo(game.player.x+20,game.player.y);

    ctx.lineTo(game.player.x,game.player.y+40);

    ctx.lineTo(game.player.x+40,game.player.y+40);

    ctx.closePath();

    ctx.fill();

    ctx.fillStyle="#fff176";

    ctx.fillRect(

        game.player.x+17,

        game.player.y+10,

        6,

        18

    );

}

function drawEnemies(){

    game.enemies.forEach(enemy=>{

        if(!enemy.alive) return;

        ctx.fillStyle="#ff5252";

        ctx.fillRect(

            enemy.x,

            enemy.y,

            enemy.w,

            enemy.h

        );

        ctx.fillStyle="white";

        ctx.fillRect(enemy.x+7,enemy.y+8,5,5);

        ctx.fillRect(enemy.x+22,enemy.y+8,5,5);

        ctx.fillStyle="#212121";

        ctx.fillRect(enemy.x+12,enemy.y+22,10,4);

    });

}
function shoot(){

    if(!game.running) return;

    game.bullets.push({

        x:game.player.x+18,

        y:game.player.y-10,

        w:4,

        h:14,

        speed:9

    });

}

let canShoot=true;

document.addEventListener("keydown",e=>{

    if(e.code==="Space"&&canShoot){

        e.preventDefault();

        shoot();

        canShoot=false;

    }

});

document.addEventListener("keyup",e=>{

    if(e.code==="Space"){

        canShoot=true;

    }

});

function moveBullets(){

    for(let i=game.bullets.length-1;i>=0;i--){

        const b=game.bullets[i];

        b.y-=b.speed;

        if(b.y<-20){

            game.bullets.splice(i,1);

        }

    }

}

function drawBullets(){

    ctx.fillStyle="#ffeb3b";

    game.bullets.forEach(b=>{

        ctx.fillRect(

            b.x,

            b.y,

            b.w,

            b.h

        );

    });

}

function launchAttacker(){

    const waiting=game.enemies.filter(e=>

        e.alive && !e.attacking

    );

    if(waiting.length===0) return;

    const enemy=

    waiting[

        Math.floor(

            Math.random()*waiting.length

        )

    ];

    enemy.attacking=true;

    enemy.vx=(

        game.player.x-enemy.x

    )/120;

    enemy.vy=3+game.enemySpeed;

}

let attackTimer=0;

function updateAttackers(){

    attackTimer++;

    if(

        attackTimer>

        120/game.enemySpeed

    ){

        attackTimer=0;

        for(

            let i=0;

            i<game.attackCount;

            i++

        ){

            launchAttacker();

        }

    }

    game.enemies.forEach(enemy=>{

        if(

            !enemy.alive ||

            !enemy.attacking

        ) return;

        enemy.x+=enemy.vx;

        enemy.y+=enemy.vy;

        if(enemy.y>HEIGHT+50){

            enemy.attacking=false;

            enemy.x=

            enemy.homeX+

            formationOffset;

            enemy.y=

            enemy.homeY;

        }

    });

}

function checkBulletCollision(){

    for(

        let i=game.bullets.length-1;

        i>=0;

        i--

    ){

        const b=

        game.bullets[i];

        for(

            let j=0;

            j<game.enemies.length;

            j++

        ){

            const e=

            game.enemies[j];

            if(!e.alive)

            continue;

            if(

                b.x<e.x+e.w&&

                b.x+b.w>e.x&&

                b.y<e.y+e.h&&

                b.y+b.h>e.y

            ){

                e.alive=false;

                e.attacking=false;

                game.bullets.splice(i,1);

                game.score+=100;

                scoreText.textContent=

                "점수 : "+game.score;

                break;

            }

        }

    }

}
function checkPlayerCollision(){

    if(!game.running) return;

    for(const enemy of game.enemies){

        if(!enemy.alive) continue;

        if(

            enemy.x < game.player.x + game.player.w &&
            enemy.x + enemy.w > game.player.x &&
            enemy.y < game.player.y + game.player.h &&
            enemy.y + enemy.h > game.player.y

        ){

            game.running=false;

            message.innerHTML="💀 GAME OVER";

            message.style.display="block";

            restart.style.display="block";

            return;

        }

    }

}

function checkClear(){

    const alive=

    game.enemies.some(

        enemy=>enemy.alive

    );

    if(!alive){

        game.running=false;

        message.innerHTML="🎉 CLEAR!";

        message.style.display="block";

        restart.style.display="block";

    }

}

function drawStars(){

    ctx.fillStyle="white";

    game.stars.forEach(star=>{

        ctx.beginPath();

        ctx.arc(

            star.x,

            star.y,

            star.r,

            0,

            Math.PI*2

        );

        ctx.fill();

        star.y+=star.speed;

        if(star.y>HEIGHT){

            star.y=0;

            star.x=Math.random()*WIDTH;

        }

    });

}

function resetGame(){

    game.running=false;

    game.score=0;

    scoreText.textContent="점수 : 0";

    game.bullets=[];

    game.attackers=[];

    formationOffset=0;

    formationDirection=1;

    attackTimer=0;

    message.style.display="none";

    restart.style.display="none";

    menu.style.display="block";

    createPlayer();

    createEnemies();

}

restart.onclick=resetGame;

initStars();

createPlayer();

createEnemies();
function draw(){

    ctx.clearRect(0,0,WIDTH,HEIGHT);

    drawStars();

    if(game.running){

        movePlayer();

        moveFormation();

        moveBullets();

        updateAttackers();

        checkBulletCollision();

        checkPlayerCollision();

        checkClear();

    }

    drawEnemies();

    drawBullets();

    drawPlayer();

}

function gameLoop(){

    draw();

    requestAnimationFrame(gameLoop);

}

gameLoop();

</script>

</body>
</html>
