<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<title>암산 연습 | Play & Study</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:"Malgun Gothic",sans-serif;

background:linear-gradient(#dff6ff,#fff8dc);

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:30px;

}

.container{

width:700px;

background:white;

border-radius:25px;

box-shadow:0 10px 30px rgba(0,0,0,.15);

padding:40px;

text-align:center;

}

h1{

color:#2196f3;

margin-bottom:25px;

}

.section{

margin:25px 0;

}

.section h2{

margin-bottom:15px;

font-size:22px;

color:#555;

}

.option-group{

display:flex;

justify-content:center;

flex-wrap:wrap;

gap:12px;

}

.option{

padding:12px 22px;

border:2px solid #90caf9;

border-radius:30px;

cursor:pointer;

background:white;

font-size:18px;

transition:.25s;

}

.option:hover{

background:#e3f2fd;

}

.option.active{

background:#42a5f5;

color:white;

border-color:#42a5f5;

}

#startBtn{

margin-top:30px;

padding:15px 45px;

font-size:22px;

border:none;

border-radius:35px;

background:#ffca28;

color:white;

cursor:pointer;

transition:.25s;

}

#startBtn:hover{

background:#ffb300;

}

#game{

display:none;

}

#progressText{

font-size:22px;

margin-bottom:15px;

}

#progressBar{

width:100%;

height:18px;

background:#eeeeee;

border-radius:30px;

overflow:hidden;

margin-bottom:25px;

}

#progress{

height:100%;

width:0%;

background:#66bb6a;

transition:.3s;

}

#question{

font-size:42px;

font-weight:bold;

margin:30px 0;

color:#333;

}

#answer{

width:220px;

padding:14px;

font-size:28px;

text-align:center;

border:2px solid #90caf9;

border-radius:15px;

}

#submitBtn{

margin-top:25px;

padding:14px 35px;

font-size:22px;

border:none;

border-radius:30px;

background:#29b6f6;

color:white;

cursor:pointer;

}

#message{

margin-top:20px;

font-size:24px;

font-weight:bold;

min-height:40px;

}

#scoreBox{

margin-top:30px;

display:flex;

justify-content:space-around;

font-size:20px;

}

#result{

display:none;

}

#result h2{

font-size:38px;

color:#4caf50;

margin-bottom:25px;

}

.resultItem{

font-size:24px;

margin:12px 0;

}

#restartBtn{

margin-top:30px;

padding:14px 40px;

font-size:22px;

border:none;

border-radius:30px;

background:#ff9800;

color:white;

cursor:pointer;

}

</style>

</head>

<body>

<div class="container">

<div id="menu">

<h1>🧠 암산 연습</h1>

<div class="section">

<h2>난이도 선택</h2>

<div class="option-group">

<div class="option active"

data-level="easy">

🟢 쉬움

</div>

<div class="option"

data-level="normal">

🟡 보통

</div>

<div class="option"

data-level="hard">

🔴 어려움

</div>

</div>

</div>

<div class="section">

<h2>문제 개수 선택</h2>

<div class="option-group">

<div class="option active"

data-count="5">5</div>

<div class="option"

data-count="10">10</div>

<div class="option"

data-count="15">15</div>

<div class="option"

data-count="20">20</div>

<div class="option"

data-count="25">25</div>

<div class="option"

data-count="30">30</div>

</div>

</div>

<button id="startBtn">

시작하기

</button>

</div>
<div id="game">

<div id="progressText">

문제 1 / 5

</div>

<div id="progressBar">

<div id="progress"></div>

</div>

<div id="question">

10 + 20 = ?

</div>

<input

type="number"

id="answer"

autocomplete="off"

placeholder="정답 입력">

<br>

<button id="submitBtn">

확인

</button>

<div id="message"></div>

<div id="scoreBox">

<div>

⭐ 점수

<br>

<span id="score">

0

</span>

</div>

<div>

🔥 연속 정답

<br>

<span id="streak">

0

</span>

</div>

</div>

</div>

<div id="result">

<h2>

🎉 완료!

</h2>

<div class="resultItem">

총 문제 :

<span id="totalResult">

0

</span>

</div>

<div class="resultItem">

맞은 개수 :

<span id="correctResult">

0

</span>

</div>

<div class="resultItem">

틀린 개수 :

<span id="wrongResult">

0

</span>

</div>

<div class="resultItem">

정답률 :

<span id="rateResult">

0%

</span>

</div>

<button id="restartBtn">

다시 하기

</button>

</div>

</div>

<script>

const menu=document.getElementById("menu");

const game=document.getElementById("game");

const result=document.getElementById("result");

const progress=document.getElementById("progress");

const progressText=document.getElementById("progressText");

const question=document.getElementById("question");

const answer=document.getElementById("answer");

const message=document.getElementById("message");

const scoreText=document.getElementById("score");

const streakText=document.getElementById("streak");

const startBtn=document.getElementById("startBtn");

const submitBtn=document.getElementById("submitBtn");

const restartBtn=document.getElementById("restartBtn");

let level="easy";

let totalCount=5;

let current=0;

let score=0;

let streak=0;

let correct=0;

let wrong=0;

let currentAnswer=0;

document

.querySelectorAll("[data-level]")

.forEach(btn=>{

btn.onclick=()=>{

document

.querySelectorAll("[data-level]")

.forEach(v=>v.classList.remove("active"));

btn.classList.add("active");

level=btn.dataset.level;

};

});

document

.querySelectorAll("[data-count]")

.forEach(btn=>{

btn.onclick=()=>{

document

.querySelectorAll("[data-count]")

.forEach(v=>v.classList.remove("active"));

btn.classList.add("active");

totalCount=Number(btn.dataset.count);

};

});

startBtn.onclick=()=>{

menu.style.display="none";

game.style.display="block";

current=0;

score=0;

streak=0;

correct=0;

wrong=0;

scoreText.textContent=0;

streakText.textContent=0;

nextQuestion();

};
function random(min,max){

    return Math.floor(

        Math.random()*(max-min+1)

    )+min;

}

function nextQuestion(){

    if(current>=totalCount){

        finishGame();

        return;

    }

    current++;

    progressText.textContent=

    "문제 "+current+" / "+totalCount;

    progress.style.width=

    (current/totalCount*100)+"%";

    answer.value="";

    message.textContent="";

    createQuestion();

    answer.focus();

}

function createQuestion(){

    let min,max;

    switch(level){

        case "easy":

            min=1;

            max=20;

            break;

        case "normal":

            min=10;

            max=99;

            break;

        default:

            min=100;

            max=999;

    }

    const type=random(0,3);

    let a,b;

    switch(type){

        // 덧셈
        case 0:

            a=random(min,max);

            b=random(min,max);

            currentAnswer=a+b;

            question.textContent=

            `${a} + ${b} = ?`;

            break;

        // 뺄셈
        case 1:

            a=random(min,max);

            b=random(min,a);

            currentAnswer=a-b;

            question.textContent=

            `${a} - ${b} = ?`;

            break;

        // 곱셈
        case 2:

            if(level==="easy"){

                a=random(2,9);

                b=random(2,9);

            }else if(level==="normal"){

                a=random(2,20);

                b=random(2,20);

            }else{

                a=random(10,99);

                b=random(2,20);

            }

            currentAnswer=a*b;

            question.textContent=

            `${a} × ${b} = ?`;

            break;

        // 나눗셈
        case 3:

            if(level==="easy"){

                b=random(2,9);

                currentAnswer=random(2,9);

            }else if(level==="normal"){

                b=random(2,12);

                currentAnswer=random(2,20);

            }else{

                b=random(2,20);

                currentAnswer=random(10,50);

            }

            a=b*currentAnswer;

            question.textContent=

            `${a} ÷ ${b} = ?`;

            break;

    }

}

const goodMessages=[

"🎉 정답이에요!",

"🌟 아주 잘했어요!",

"💯 최고예요!",

"😊 계속 이렇게 해봐요!"

];

const badMessages=[

"🙂 괜찮아요! 다음 문제를 풀어봐요.",

"💪 실수할 수도 있어요!",

"🌼 조금만 더 생각해볼까요?",

"❤️ 다음 문제는 맞힐 수 있어요!"

];

function checkAnswer(){

    const value=

    Number(answer.value);

    if(value===currentAnswer){

        correct++;

        streak++;

        score+=100;

        scoreText.textContent=score;

        streakText.textContent=streak;

        message.style.color="#4caf50";

        message.textContent=

        goodMessages[

        random(

        0,

        goodMessages.length-1

        )

        ];

    }else{

        wrong++;

        streak=0;

        streakText.textContent=0;

        message.style.color="#f44336";

        message.textContent=

        badMessages[

        random(

        0,

        badMessages.length-1

        )

        ];

    }

    setTimeout(

        nextQuestion,

        800

    );

}

submitBtn.onclick=

checkAnswer;

answer.addEventListener(

"keydown",

e=>{

if(e.key==="Enter"){

checkAnswer();

}

});
function finishGame(){

    game.style.display="none";

    result.style.display="block";

    document.getElementById("totalResult").textContent=totalCount;

    document.getElementById("correctResult").textContent=correct;

    document.getElementById("wrongResult").textContent=wrong;

    const rate=Math.round((correct/totalCount)*100);

    document.getElementById("rateResult").textContent=rate+"%";

}

restartBtn.onclick=()=>{

    result.style.display="none";

    menu.style.display="block";

    progress.style.width="0%";

    message.textContent="";

    answer.value="";

};

</script>

</body>

</html>
