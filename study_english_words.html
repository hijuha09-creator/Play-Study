const card=document.getElementById("card");

const word=document.getElementById("word");

const meaning=document.getElementById("meaning");

const startBtn=document.getElementById("startBtn");

let mode="study";

let count=50;

let current=0;

let score=0;

let wrong=0;

let favorite=[];

let unknown=[];

let quiz=[];

let showMeaning=false;
document.querySelectorAll("[data-count]").forEach(btn=>{

btn.onclick=()=>{

document.querySelectorAll("[data-count]").forEach(v=>v.classList.remove("active"));

btn.classList.add("active");

count=Number(btn.dataset.count);

};

});

document.querySelectorAll("[data-mode]").forEach(btn=>{

btn.onclick=()=>{

document.querySelectorAll("[data-mode]").forEach(v=>v.classList.remove("active"));

btn.classList.add("active");

mode=btn.dataset.mode;

};

});

startBtn.onclick=()=>{

menu.style.display="none";

if(mode==="study"){

studyPage.style.display="block";

}else{

testPage.style.display="block";

}

loadWords();

};

function loadWords(){

quiz=words.slice(0,count);

shuffle(quiz);

current=0;

score=0;

wrong=0;

if(mode==="study"){

showStudy();

}else{

showTest();

}

}

function shuffle(arr){

for(let i=arr.length-1;i>0;i--){

const j=Math.floor(Math.random()*(i+1));

[arr[i],arr[j]]=[arr[j],arr[i]];

}

}

function showStudy(){

if(current>=quiz.length){

studyPage.style.display="none";

resultPage.style.display="block";

showResult();

return;

}

showMeaning=false;

meaning.style.display="none";

word.textContent=quiz[current].word;

meaning.textContent=quiz[current].meaning;

document.getElementById("studyNumber").textContent=

(current+1)+" / "+quiz.length;

document.getElementById("studyProgress").style.width=

((current+1)/quiz.length*100)+"%";

}

card.onclick=()=>{

showMeaning=!showMeaning;

meaning.style.display=

showMeaning?"block":"none";

};

document.getElementById("nextBtn").onclick=()=>{

if(current<quiz.length-1){

current++;

showStudy();

}else{

current=quiz.length;

showStudy();

}

};

document.getElementById("prevBtn").onclick=()=>{

if(current>0){

current--;

showStudy();

}

};

document.getElementById("favoriteBtn").onclick=()=>{

const target=quiz[current].word;

if(!favorite.includes(target)){

favorite.push(target);

alert("⭐ 즐겨찾기에 추가되었습니다.");

}

};

document.getElementById("unknownBtn").onclick=()=>{

const target=quiz[current].word;

if(!unknown.includes(target)){

unknown.push(target);

alert("❤️ 모르는 단어에 추가되었습니다.");

}

};
 function showTest(){

if(current>=quiz.length){

testPage.style.display="none";

resultPage.style.display="block";

showResult();

return;

}

document.getElementById("testNumber").textContent=

(current+1)+" / "+quiz.length;

document.getElementById("testProgress").style.width=

((current+1)/quiz.length*100)+"%";

document.getElementById("questionWord").textContent=

quiz[current].word;

const choiceBox=document.getElementById("choiceBox");

choiceBox.innerHTML="";

const answer=quiz[current].meaning;

const choices=[answer];

while(choices.length<4){

const randomMeaning=

words[Math.floor(Math.random()*words.length)].meaning;

if(!choices.includes(randomMeaning)){

choices.push(randomMeaning);

}

}

shuffle(choices);

choices.forEach(text=>{

const btn=document.createElement("button");

btn.className="option";

btn.textContent=text;

btn.onclick=()=>checkAnswer(text);

choiceBox.appendChild(btn);

});

document.getElementById("testMessage").textContent="";

}

function checkAnswer(select){

const msg=document.getElementById("testMessage");

const answer=quiz[current].meaning;

const buttons=document.querySelectorAll("#choiceBox button");

buttons.forEach(btn=>btn.disabled=true);

if(select===answer){

score++;

msg.style.color="#43a047";

msg.textContent="✅ 정답입니다!";

}else{

wrong++;

msg.style.color="#e53935";

msg.textContent="❌ 정답 : "+answer;

}

setTimeout(()=>{

current++;

showTest();

},900);

}

function showResult(){

const total=score+wrong;

const rate=Math.round(score/total*100);

document.getElementById("correctCount").textContent=score;

document.getElementById("wrongCount").textContent=wrong;

document.getElementById("rate").textContent=rate+"%";

let grade="D";

if(rate===100){

grade="S";

}else if(rate>=90){

grade="A";

}else if(rate>=80){

grade="B";

}else if(rate>=70){

grade="C";

}

document.getElementById("grade").textContent=

grade;

}
