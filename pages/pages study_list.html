<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>공부 목록 | Play & Study</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/header.css">

    <script src="../js/header.js" defer></script>

</head>

<body>

    <!-- 공통 헤더 -->
    <div id="header"></div>

    <main>

        <div class="container">

            <!-- 페이지 제목 -->

            <section class="hero">

                <div class="hero-logo">
                    📚
                </div>

                <h1>공부 목록</h1>

                <p>

                    재미있게 배우고<br>
                    꾸준히 실력을 키워보세요!

                </p>

            </section>

            <!-- 공부 목록 -->

            <section class="game-grid">

                <!-- 암산 연습 -->

                <article class="game-card">

                    <div class="game-icon">➕</div>

                    <h2>암산 연습</h2>

                    <p>

                        빠르고 정확한 계산 능력을
                        길러보세요.

                    </p>

                    <a
                        href="study_math.html"
                        class="game-button">

                        공부 시작

                    </a>

                </article>

                <!-- 영어 단어 -->

                <article class="game-card">

                    <div class="game-icon">🔤</div>

                    <h2>영어 단어</h2>

                    <p>

                        다양한 영어 단어를
                        재미있게 학습해 보세요.

                    </p>

                    <a
                        href="study_english.html"
                        class="game-button">

                        공부 시작

                    </a>

                </article>

                <!-- 맞춤법 -->

                <article class="game-card">

                    <span class="coming-badge">

                        준비 중

                    </span>

                    <div class="game-icon">🇰🇷</div>

                    <h2>맞춤법</h2>

                    <p>

                        올바른 맞춤법과
                        띄어쓰기를 연습합니다.

                    </p>

                    <button
                        class="game-button disabled"
                        disabled>

                        준비 중

                    </button>

                </article>

                <!-- 한국사 -->

                <article class="game-card">

                    <span class="coming-badge">

                        준비 중

                    </span>

                    <div class="game-icon">🏛</div>

                    <h2>한국사</h2>

                    <p>

                        역사 속 다양한 이야기를
                        재미있게 배워보세요.

                    </p>

                    <button
                        class="game-button disabled"
                        disabled>

                        준비 중

                    </button>

                </article>

                <!-- 세계사 -->

                <article class="game-card">

                    <span class="coming-badge">

                        준비 중

                    </span>

                    <div class="game-icon">🌍</div>

                    <h2>세계사</h2>

                    <p>

                        세계의 역사와 문화를
                        쉽고 재미있게 학습합니다.

                    </p>

                    <button
                        class="game-button disabled"
                        disabled>

                        준비 중

                    </button>

                </article>

            </section>

        </div>

    </main>

    <footer>

        © 2026 Play & Study

    </footer>

</body>

</html>
