<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>게임 목록 | Play & Study</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/header.css">

    <script src="../js/header.js" defer></script>

</head>

<body>

    <!-- 공통 헤더 -->
    <div id="header"></div>

    <main>

        <div class="container">

            <!-- 페이지 제목 -->

            <section class="hero">

                <div class="hero-logo">
                    🎮
                </div>

                <h1>게임 목록</h1>

                <p>

                    재미있는 게임을 선택하고<br>
                    즐겁게 플레이해 보세요!

                </p>

            </section>

            <!-- 게임 목록 -->

            <section class="game-grid">

                <!-- 지뢰찾기 -->

                <article class="game-card">

                    <div class="game-icon">💣</div>

                    <h2>지뢰찾기</h2>

                    <p>

                        숫자를 보고 지뢰를 피해
                        모든 칸을 열어보세요.

                    </p>

                    <a
                        href="game_minesweeper.html"
                        class="game-button">

                        게임 시작

                    </a>

                </article>

                <!-- 테트리스 -->

                <article class="game-card">

                    <div class="game-icon">🧱</div>

                    <h2>테트리스</h2>

                    <p>

                        블록을 쌓아 줄을 완성해
                        최고 점수에 도전하세요.

                    </p>

                    <a
                        href="game_tetris.html"
                        class="game-button">

                        게임 시작

                    </a>

                </article>

                <!-- 갤러그 -->

                <article class="game-card">

                    <div class="game-icon">🚀</div>

                    <h2>갤러그</h2>

                    <p>

                        적을 물리치며
                        최고의 파일럿이 되어보세요.

                    </p>

                    <a
                        href="game_galaga.html"
                        class="game-button">

                        게임 시작

                    </a>

                </article>

                <!-- 2048 -->

                <article class="game-card">

                    <span class="coming-badge">

                        준비 중

                    </span>

                    <div class="game-icon">🧩</div>

                    <h2>2048</h2>

                    <p>

                        같은 숫자를 합쳐
                        2048을 만들어 보세요.

                    </p>

                    <button
                        class="game-button disabled"
                        disabled>

                        준비 중

                    </button>

                </article>

                <!-- 가위바위보 -->

                <article class="game-card">

                    <span class="coming-badge">

                        준비 중

                    </span>

                    <div class="game-icon">✂️</div>

                    <h2>가위바위보</h2>

                    <p>

                        연승에 도전하는
                        재미있는 미니게임입니다.

                    </p>

                    <button
                        class="game-button disabled"
                        disabled>

                        준비 중

                    </button>

                </article>

            </section>

        </div>

    </main>

    <footer>

        © 2026 Play & Study

    </footer>

</body>

</html>
